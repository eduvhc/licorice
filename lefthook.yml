pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,md,json}"
      run: node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: "apps/web/**/*.{ts,tsx}"
      run: apps/web/node_modules/.bin/eslint --fix {staged_files}
      stage_fixed: true
